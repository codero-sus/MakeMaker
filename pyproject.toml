[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "makemaker"
version = "0.1.0"
description = "Generate real applications for Android, iOS, Windows, macOS and Linux from templates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "codero-sus" }]
keywords = ["scaffolding", "generator", "android", "ios", "windows", "macos", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Code Generators",
]

# MakeMaker deliberately has no runtime dependencies: the Python half is
# standard library only, and the optional build driver is plain C11.
dependencies = []

[project.scripts]
makemaker = "makemaker.cli:main"

[project.urls]
Homepage = "https://github.com/codero-sus/MakeMaker"
Repository = "https://github.com/codero-sus/MakeMaker"

[tool.setuptools]
packages = ["makemaker"]

[tool.setuptools.package-data]
makemaker = [
    "templates/*",
    "templates/**/*",
    "templates/**/*.*",
]
